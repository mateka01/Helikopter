<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Játék Hozzáadás</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="kepek/favicon.png" type="image/x-icon">
</head>

<body style="background-color: rgba(193, 244, 54, 0.474);">

    <header class="p-3">
        <h1 class="text-center">Játék Hozzáadás</h1>
    </header>
    <nav class="bg-dark text-light p-1 mb-3">
        <ul class="d-flex justify-content-around">
            <li><a href="konyvtar.html">Könyvtár</a></li>
            <li>Új játék hozzáadása (itt vagy)</li>
            <li><a href="wishlist.html">Kedvencek / Wishlist</a></li>
            <li><a href="news.html">Hírek</a></li>
        </ul>
    </nav>
    <hr>

    <div class="container">
        <form id="adatform" class="bg-success p-3 rounded">
            <h3>Új játék hozzáadása</h3>
            <input type="text" id="jnev" class="form-control mb-2" placeholder="Játék neve">
            <input type="text" id="jmufaj" class="form-control mb-2" placeholder="Műfaj">
            <select name="" id="jelerhetoseg" class="form-select mb-2">
                <option value="PC">PC</option>
                <option value="XBOX">Xbox</option>
                <option value="PlayStation">PlayStation</option>
                <option value="Egyéb">Egyéb</option>
            </select>
            <p>Értékelés</p>
            <input type="range" min="1" max="5" step="0.1" id="jertekeles" class="form-range">
            <p id="rangevissz">Értékelés: </p>

            <textarea id="jvelemeny" class="form-control mb-2" placeholder="Írj véleményt..."></textarea>
            <button type="submit" class="btn btn-dark">Mentés</button>
        </form>
    </div>

    <script>
        let csuszka = document.getElementById("jertekeles");
        let ertek = document.getElementById("rangevissz");
        csuszka.addEventListener("input", function () {
            ertek.innerText = "Értékelés: " + csuszka.value;
        });
        const form = document.getElementById("adatform");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const nev = document.getElementById("jnev").value;
            const mufaj = document.getElementById("jmufaj").value;
            const elerhetoseg = document.getElementById("jelerhetoseg").value;
            const ertekeles = document.getElementById("jertekeles").value;
            const velemeny = document.getElementById("jvelemeny").value;

            let jatekok = JSON.parse(localStorage.getItem("jatekok")) || [];

            const ujjatekok = {
                nev,
                mufaj,
                elerhetoseg,
                ertekeles,
                velemeny
            };

            jatekok.push(ujjatekok)
            localStorage.setItem("jatekok", JSON.stringify(jatekok));

            alert("Játék elmentve!");

            form.reset();

            ertek.innerText = "Értékelés: ";

        });
    </script>

</body>

</html>
